name: Feature request
description: 建议一个桌面端能力（窗口行为、安装体验、菜单、打包……）
title: '[Feature] '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        这个仓库只负责「把 Harness 装进桌面窗口」。如果建议的是 Harness 本体功能
        （Agent 能力、工具、插件、会话、模型设置……），请提到上游
        [deepseek-ai/deepseek-harness](https://github.com/deepseek-ai/deepseek-harness)。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述使用场景，而不只是解决方案
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你希望它怎么表现
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
