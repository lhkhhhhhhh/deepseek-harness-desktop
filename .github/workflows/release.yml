name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish installers
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install build dependencies
        run: npm ci

      - name: Generate the application icon
        shell: pwsh
        run: ./build/make-icon.ps1

      - name: Fetch the Harness runtime
        run: npm run fetch:runtime

      - name: Environment self-check
        run: npm run doctor

      - name: Verify the launch chain without a window
        run: npm run smoke

      - name: Build the installer and the portable build
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Attach artifacts to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.blockmap
          body: |
            Windows desktop client for DeepSeek Harness.

            | Download | Notes |
            | --- | --- |
            | `DeepSeek-Harness-Setup-*.exe` | Installer. Per-user, no administrator rights needed. Creates a desktop shortcut and a Start Menu entry. |
            | `DeepSeek-Harness-Portable-*.exe` | Runs without installing. No shortcut is created. |

            **Requirement:** Node.js 20 or newer — the Harness itself is a Node program.
            The Harness runtime is bundled, so the first launch works offline.

            These builds are unsigned, so Windows SmartScreen may warn about an unknown
            publisher. Choose "More info" then "Run anyway", or build from source.
