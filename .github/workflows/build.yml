name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build installer (Windows)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install build dependencies
        run: npm ci

      - name: Generate the application icon
        shell: pwsh
        run: ./build/make-icon.ps1

      - name: Fetch the Harness runtime
        run: npm run fetch:runtime

      - name: Environment self-check
        run: npm run doctor

      - name: Verify the launch chain without a window
        run: npm run smoke

      - name: Build the installer
        run: npx electron-builder --win --x64 --publish never
        env:
          # Signing is optional; without secrets the artifacts are simply unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-desktop-windows-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            release/*.exe
            release/*.blockmap
